name: Lint and Test
on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  go-version-to-install: "stable"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go-version-to-install }}

      - name: Install Dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go-version-to-install }}

      - name: Install Dependencies
        run: go mod download

      - name: Test
        id: run-tests
        run: go tool gotestsum --format github-actions --junitfile=junit.xml -- -cover ./... -coverprofile=coverage.txt
      - name: Code coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results

  test-race:
    name: Test (race)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go-version-to-install }}

      - name: Install Dependencies
        run: go mod download

      - name: Test
        run: go tool gotestsum --format github-actions -- -race ./...
